<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whimsy Hollow</title>
    <style>
      html, body {
        margin: 0; height: 100%;
        background: radial-gradient(ellipse at center, #2b4035 0%, #1a231d 75%);
      }
      body { font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; flex-direction: column; gap: 18px;
        color: #fff7e3; z-index: 99; pointer-events: none;
        transition: opacity 600ms ease;
      }
      #boot.hide { opacity: 0; }
      #boot h1 {
        font-size: 52px; margin: 0; letter-spacing: 1px;
        color: #fff4d6;
        text-shadow: 0 4px 12px rgba(0,0,0,.55), 0 0 28px rgba(242,179,92,.35);
      }
      #boot p {
        font-size: 15px; margin: 0; color: #eadfc0; opacity: 0.85;
        letter-spacing: 0.5px;
      }
      .dots span {
        display: inline-block; width: 9px; height: 9px; margin: 0 4px;
        background: #f2b35c; border-radius: 50%; opacity: 0.4;
        animation: pulse 1.2s infinite ease-in-out;
      }
      .dots span:nth-child(2) { animation-delay: 0.15s; }
      .dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes pulse {
        0%, 80%, 100% { opacity: 0.35; transform: scale(1); }
        40%           { opacity: 1; transform: scale(1.3); }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <h1>Whimsy Hollow</h1>
      <p>Packing tiny treasures…</p>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div id="backdrop"></div>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // Fade out the boot splash once Phaser has had a moment to paint.
      // The first scene's create() runs synchronously after preload, so a
      // small delay after window load is enough.
      window.addEventListener('load', () => {
        setTimeout(() => {
          const el = document.getElementById('boot');
          if (!el) return;
          el.classList.add('hide');
          setTimeout(() => el.remove(), 700);
        }, 1500);
      });
    </script>
  </body>
</html>

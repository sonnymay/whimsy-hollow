<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whimsy Hollow</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2a2620; }
      body { font-family: "Arial Rounded MT Bold", "Trebuchet MS", Arial, sans-serif; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center;
        justify-content: center; flex-direction: column; gap: 14px;
        color: #fff4d6; z-index: 99; pointer-events: none;
        transition: opacity 600ms ease;
      }
      #boot.hide { opacity: 0; }
      #boot h1 { font-size: 36px; margin: 0; letter-spacing: 1px; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
      #boot p { font-size: 15px; margin: 0; color: #eadfc0; opacity: 0.85; }
      .dots span {
        display: inline-block; width: 8px; height: 8px; margin: 0 3px;
        background: #fff4d6; border-radius: 50%; opacity: 0.4;
        animation: pulse 1.2s infinite ease-in-out;
      }
      .dots span:nth-child(2) { animation-delay: 0.15s; }
      .dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes pulse {
        0%, 80%, 100% { opacity: 0.4; transform: scale(1); }
        40%           { opacity: 1; transform: scale(1.25); }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <h1>Whimsy Hollow</h1>
      <p>Packing tiny treasures…</p>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div id="backdrop"></div>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // Fade out the boot splash once Phaser has had a moment to paint.
      // The first scene's create() runs synchronously after preload, so a
      // small delay after window load is enough.
      window.addEventListener('load', () => {
        setTimeout(() => {
          const el = document.getElementById('boot');
          if (!el) return;
          el.classList.add('hide');
          setTimeout(() => el.remove(), 700);
        }, 1500);
      });
    </script>
  </body>
</html>
